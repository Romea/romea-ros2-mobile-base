name: "base"
launch:
  - include:
      file: "$(find-pkg-share romea_mobile_base_meta_bringup)/profile/adap2e.launch.py"
      arg:
        - name: "joystick_topic"
          value: "/adap2e/joystic/joy"
        - name: "joystick_configuration_file_path"
          value: "$(find-pkg-share romea_joystick_utils)/config/microsoft_xbox.yaml"
configuration:
  manufacturer: inrae
  model: adap2e
  version: fat
records:
  joint_states: true
  controller/odom: true
  controller/odometry: true
  controller/kinematic: true
simulation:
  initial_xyz: [1.0, 2.0, 3.0]
  initial_rpy: [4.0, 5.0, 6.0]
